<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>しんウノ — 対戦</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='14' fill='%230e0e1d'/><rect x='20' y='10' width='60' height='80' rx='8' fill='%23c9a84c' opacity='.9'/><text y='62' x='50' text-anchor='middle' font-size='48' font-family='serif'>🃏</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a84c;--gold-light:#f0d080;--gold-dim:#7a6430;--deep:#07070f;--panel:#0e0e1d;--panel2:#131325;--text:#e8e0d0;--text-dim:#8a8070;--border:rgba(201,168,76,.18);--red:#e74c3c;--blue:#3498db;--green:#2ecc71;--yellow:#f1c40f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--deep);color:var(--text);font-family:'Noto Sans JP',sans-serif;display:flex;flex-direction:column}
#loadScr{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;z-index:999}
.load-logo{font-family:'Rajdhani',sans-serif;font-size:clamp(1.3rem,5vw,2rem);font-weight:700;color:var(--gold)}
.load-msg{font-family:'Rajdhani',sans-serif;letter-spacing:.15em;color:var(--text-dim);font-size:.85rem}
.load-bar{width:min(200px,80vw);height:3px;background:#141428;border-radius:3px;overflow:hidden}
.load-fill{height:100%;width:0;background:linear-gradient(90deg,#7a6430,#c9a84c);border-radius:3px;transition:width .5s}
#gameApp{display:flex;flex-direction:column;height:100%;overflow:hidden}
/* HUD */
.hud{display:flex;align-items:center;gap:.38rem;padding:.28rem .48rem;background:rgba(10,10,20,.96);border-bottom:1px solid var(--border);flex-shrink:0;min-height:34px}
.hud-back{color:var(--gold-dim);text-decoration:none;font-family:'Rajdhani',sans-serif;font-size:.7rem}
.hud-title{font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:700;color:var(--gold);flex:1;text-align:center}
.hud-turn{font-family:'Rajdhani',sans-serif;font-size:.65rem;color:var(--text-dim);flex-shrink:0}
.tbadge{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;padding:.18rem .48rem;border-radius:4px;text-transform:uppercase;flex-shrink:0}
.tb-a{background:rgba(231,76,60,.18);color:var(--red);border:1px solid rgba(231,76,60,.5)}
.tb-d{background:rgba(52,152,219,.18);color:var(--blue);border:1px solid rgba(52,152,219,.5)}
.tb-w{background:rgba(138,128,112,.1);color:var(--text-dim);border:1px solid rgba(138,128,112,.2)}
/* TURN BANNER */
.turn-banner{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:.38rem .5rem;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:clamp(.82rem,3.2vw,.95rem);letter-spacing:.1em;text-transform:uppercase;border-bottom:2px solid transparent;transition:background .3s}
.turn-banner.attack{background:rgba(231,76,60,.16);border-bottom-color:rgba(231,76,60,.6);color:var(--red);animation:pA .9s ease-in-out infinite alternate}
.turn-banner.defend{background:rgba(52,152,219,.16);border-bottom-color:rgba(52,152,219,.6);color:var(--blue);animation:pD .9s ease-in-out infinite alternate}
.turn-banner.wait{background:rgba(20,20,40,.6);border-bottom-color:rgba(100,100,130,.2);color:var(--text-dim)}
@keyframes pA{to{background:rgba(231,76,60,.26)}}
@keyframes pD{to{background:rgba(52,152,219,.26)}}
/* MY STATUS */
.my-status{display:flex;align-items:center;gap:.42rem;padding:.32rem .5rem;background:rgba(5,5,18,.94);border-bottom:1px solid var(--border);flex-shrink:0}
.mys-name{font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:700;color:var(--gold);flex-shrink:0;max-width:75px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mys-hp-row{display:flex;align-items:center;gap:.3rem;flex:1;min-width:70px}
.mys-hp-bar-out{flex:1;height:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.mys-hp-bar-in{height:100%;border-radius:6px;transition:width .5s;background:linear-gradient(90deg,#c0392b,#e67e22,#27ae60)}
.mys-hp-txt{font-family:'Rajdhani',sans-serif;font-size:.88rem;font-weight:700;color:#fff;flex-shrink:0;min-width:40px;text-align:right}
.cost-circle{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:2.5px solid rgba(201,168,76,.5);background:rgba(201,168,76,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:border-color .4s,box-shadow .4s}
.cost-circle-lbl{font-family:'Rajdhani',sans-serif;font-size:.4rem;letter-spacing:.1em;color:var(--gold-dim);text-transform:uppercase;line-height:1}
.cost-circle-num{font-family:'Rajdhani',sans-serif;font-size:1.2rem;font-weight:700;color:var(--gold);line-height:1}
/* WEATHER */
.wbar{display:flex;align-items:center;gap:.4rem;padding:.24rem .48rem;background:rgba(8,8,20,.85);border-bottom:1px solid var(--border);flex-shrink:0;font-family:'Rajdhani',sans-serif;font-size:.68rem}
.wbar .wc{font-size:.56rem;color:var(--text-dim);margin-left:auto}
/* HINT */
.shint{padding:.24rem .48rem;background:rgba(201,168,76,.07);border-bottom:1px solid var(--border);font-family:'Rajdhani',sans-serif;font-size:.62rem;color:var(--gold);flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* SCROLL */
.gscroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:.3rem .35rem .3rem}
/* OPPONENTS */
.opp-area{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:.4rem .52rem;margin-bottom:.28rem;transition:border-color .3s}
.opp-area.oa{border-color:rgba(231,76,60,.55)}
.opp-area.od{border-color:rgba(52,152,219,.55)}
.opp-dead{opacity:.45;border-color:rgba(100,100,100,.3)!important}
.opp-info{display:flex;align-items:center;gap:.38rem;flex-wrap:wrap;margin-bottom:.22rem}
.opp-name{font-family:'Rajdhani',sans-serif;font-size:.82rem;font-weight:700;color:var(--gold)}
.rpill{font-family:'Rajdhani',sans-serif;font-size:.55rem;font-weight:700;padding:.1rem .36rem;border-radius:3px;text-transform:uppercase}
.rp-a{background:rgba(231,76,60,.18);color:var(--red);border:1px solid rgba(231,76,60,.4)}
.rp-d{background:rgba(52,152,219,.18);color:var(--blue);border:1px solid rgba(52,152,219,.4)}
.rp-w{background:rgba(138,128,112,.1);color:var(--text-dim);border:1px solid rgba(138,128,112,.18)}
.rp-dead{background:rgba(60,60,60,.3);color:var(--text-dim);border:1px solid rgba(100,100,100,.25)}
/* Opponent HP row — larger for mobile readability */
.opp-hp-row{display:flex;align-items:center;gap:.3rem;flex:1;min-width:100px}
.opp-hb-out{flex:1;height:10px;background:rgba(255,255,255,.07);border-radius:5px;overflow:hidden;position:relative}
.opp-hb-in{height:100%;border-radius:5px;transition:width .5s;background:linear-gradient(90deg,var(--red),#e67e22,var(--green))}
.opp-hp-txt{font-family:'Rajdhani',sans-serif;font-size:.8rem;font-weight:700;color:var(--text);min-width:38px;text-align:right}
.opp-cost-c{width:26px;height:26px;border-radius:50%;border:2px solid rgba(201,168,76,.45);background:rgba(201,168,76,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.occ-l{font-family:'Rajdhani',sans-serif;font-size:.35rem;color:var(--gold-dim);text-transform:uppercase;line-height:1}
.occ-n{font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;color:var(--gold);line-height:1}
.opp-hand-count{display:inline-flex;align-items:center;gap:.18rem;align-self:center;font-family:'Rajdhani',sans-serif;font-size:.58rem;font-weight:800;color:#5b5065;background:rgba(255,255,255,.78);border:1px solid rgba(122,92,145,.18);border-radius:999px;padding:.12rem .42rem;white-space:nowrap}
/* BATTLEFIELD */
.battlefield{display:grid;grid-template-columns:1fr 58px 1fr;gap:.28rem;margin:.25rem 0;align-items:start}
.field-col{display:flex;flex-direction:column;gap:.1rem}
.field-lbl{font-family:'Rajdhani',sans-serif;font-size:.5rem;letter-spacing:.12em;color:var(--text-dim);text-transform:uppercase;text-align:center;margin-bottom:.1rem}
.field-zone{background:rgba(0,0,0,.4);border:1px solid var(--border);border-radius:7px;padding:.26rem;min-height:92px;display:flex;align-items:center;justify-content:center}
.field-empty{border:1px dashed rgba(201,168,76,.12);border-radius:5px;width:56px;height:80px;display:flex;align-items:center;justify-content:center;font-size:.95rem;opacity:.13}
.discard-col{display:flex;flex-direction:column;align-items:center;gap:.1rem}
.discard-lbl{font-family:'Rajdhani',sans-serif;font-size:.44rem;letter-spacing:.1em;color:var(--gold-dim);text-transform:uppercase}
.discard-zone{background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.22);border-radius:7px;padding:.26rem;width:58px;min-height:92px;display:flex;align-items:center;justify-content:center}
.discard-none{font-family:'Rajdhani',sans-serif;font-size:.42rem;color:rgba(201,168,76,.28);text-align:center;line-height:1.5}
/* GAME CARD — field/discard small */
.gc{width:56px;height:80px;border-radius:5px;border:1.5px solid;background:var(--panel2);display:flex;flex-direction:column;cursor:pointer;transition:transform .12s;position:relative;overflow:hidden;flex-shrink:0}
.gc:hover{transform:translateY(-5px) scale(1.04)}
.gc.sel{transform:translateY(-12px) scale(1.09);z-index:20;outline:3px solid var(--gold);outline-offset:1px}
.gc.dim{opacity:.2;cursor:not-allowed}
.gc.dim:hover{transform:none}
.gc.static-card,.gc.facedown{cursor:default}
.gc.static-card:hover,.gc.facedown:hover{transform:none}
.gc.facedown{background:repeating-linear-gradient(45deg,var(--panel2)0,var(--panel2)4px,rgba(201,168,76,.04)4px,rgba(201,168,76,.04)8px)}
.gc-cs{height:4px;display:flex;flex-shrink:0;border-radius:3px 3px 0 0}
.gc-cs-seg{flex:1}
.gc-head{padding:2px 3px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.88);flex-shrink:0;gap:2px}
.gc-cost{width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.56rem;color:#000;flex-shrink:0}
.gc-name{font-size:.38rem;color:rgba(255,255,255,.65);overflow:hidden;font-family:'Rajdhani',sans-serif;font-weight:700;word-break:break-all;line-height:1.2;max-height:1.6em;flex:1}
.gc-art{height:30px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;background:rgba(0,0,0,.15);position:relative;overflow:hidden;flex-shrink:0}
.gc-art img{width:100%;height:100%;object-fit:contain;background:#12121e}
.gc-stats{display:flex;justify-content:space-around;padding:2px;background:rgba(0,0,0,.9);flex-shrink:0;font-family:'Rajdhani',sans-serif;font-size:.52rem;font-weight:700}
.gc-flavor{flex:1;padding:1px 3px;background:rgba(0,0,0,.85);overflow:hidden;display:flex;flex-direction:column;gap:1px}.static-card .gc-flavor{overflow:visible;flex:unset}
.gc-ft{font-size:.38rem;color:rgba(255,255,255,.32);font-style:italic;line-height:1.3;overflow:hidden}
.gc-sl{font-size:.38rem;color:#f1c40f;line-height:1.25;overflow:hidden}
.gc-sdot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#f1c40f;z-index:3}
/* HAND CARD — 2.5x larger */
.gc.hand-card{width:148px;height:232px;border-radius:10px;border:2px solid}
.gc.hand-card:hover{transform:translateY(-11px) scale(1.04)}
.gc.hand-card.sel{transform:translateY(-18px) scale(1.08);outline:3px solid var(--gold);outline-offset:2px}
.gc.hand-card.dim:hover{transform:none}
.gc.hand-card .gc-cs{height:6px;border-radius:8px 8px 0 0}
.gc.hand-card .gc-head{padding:4px 6px}
.gc.hand-card .gc-cost{width:25px;height:25px;font-size:.78rem}
.gc.hand-card .gc-name{font-size:.6rem;max-height:2.4em;word-break:break-all;line-height:1.2}
.gc.hand-card .gc-art{height:88px;font-size:3rem}
.gc.hand-card .gc-stats{font-size:.75rem;padding:3px 5px}
.gc.hand-card .gc-sdot{width:6px;height:6px;top:3px;right:3px}
.gc.hand-card .gc-ft{font-size:.54rem;line-height:1.4;-webkit-line-clamp:2;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.gc.hand-card .gc-sl{font-size:.54rem;line-height:1.35}
/* HAND */
.hs-wrap{margin:.25rem 0 0}
.hand-label{font-family:'Rajdhani',sans-serif;font-size:.58rem;letter-spacing:.14em;color:var(--text-dim);text-transform:uppercase;margin-bottom:.2rem;padding:0 .08rem}
.hand-scroll{display:flex;gap:.4rem;overflow-x:auto;padding:.22rem .08rem .38rem;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;min-height:258px;align-items:flex-end}
.hand-scroll::-webkit-scrollbar{height:3px}
.hand-scroll::-webkit-scrollbar-thumb{background:rgba(201,168,76,.32);border-radius:2px}
/* ACTION BAR */
.abar{display:flex;gap:.28rem;align-items:center;padding:.32rem .42rem;background:rgba(0,0,0,.85);border-top:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.22rem;padding:.42rem .72rem;border:none;border-radius:7px;font-family:'Rajdhani',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .12s;touch-action:manipulation;-webkit-user-select:none;user-select:none;white-space:nowrap}
.btn:active{transform:scale(.92)}
.btn-gold{background:linear-gradient(135deg,var(--gold-dim),var(--gold));color:var(--deep)}
.btn-gold:disabled{opacity:.2;cursor:not-allowed}
.btn-blue{background:linear-gradient(135deg,#1a4a6b,#2471a3);color:#fff}
.btn-blue:disabled{opacity:.2;cursor:not-allowed}
.btn-red{background:linear-gradient(135deg,#7b241c,#c0392b);color:#fff}
.btn-red:disabled{opacity:.2;cursor:not-allowed}
.btn-gray{background:rgba(80,80,100,.22);color:var(--text-dim);border:1px solid rgba(80,80,100,.28);font-size:.66rem;padding:.38rem .55rem}
/* LOG */
.glog{height:54px;overflow-y:auto;padding:.26rem .48rem;background:rgba(0,0,0,.72);border-top:1px solid var(--border);flex-shrink:0;font-size:.63rem;line-height:1.6}
.glog::-webkit-scrollbar{width:3px}
.glog::-webkit-scrollbar-thumb{background:rgba(201,168,76,.25)}
.le{color:var(--text-dim)}.le.hl{color:var(--gold)}.le.dmg{color:var(--red)}.le.heal{color:var(--green)}.le.eff{color:#f1c40f}.le.wth{color:#87ceeb}
/* TOOLTIP */
.tooltip{position:fixed;z-index:500;background:rgba(5,5,18,.97);border:1px solid var(--gold-dim);border-radius:9px;padding:.6rem;font-size:.7rem;max-width:190px;pointer-events:none;display:none;line-height:1.55;backdrop-filter:blur(4px)}
.tt-name{color:var(--gold);font-family:'Rajdhani',sans-serif;font-size:.9rem;font-weight:700;margin-bottom:.2rem}
.tt-stat{color:var(--text-dim);margin-bottom:.2rem;font-family:'Rajdhani',sans-serif;font-size:.74rem}
.tt-skill{color:#f1c40f;font-style:italic;font-size:.7rem;white-space:pre-wrap}
.tt-flavor{color:var(--text-dim);font-style:italic;font-size:.65rem;margin-top:.18rem;border-top:1px solid var(--border);padding-top:.18rem}
/* VFX — lightweight, CSS-only where possible */
.dmg-float{position:fixed;z-index:600;font-family:'Rajdhani',sans-serif;font-weight:900;pointer-events:none;animation:fup 1.6s ease-out forwards;will-change:transform,opacity}
@keyframes fup{0%{opacity:1;transform:translateY(0)scale(1.2)}80%{opacity:.8}100%{opacity:0;transform:translateY(-80px)scale(.7)}}
.df-r{color:var(--red);font-size:clamp(1.8rem,7vw,2.8rem);text-shadow:0 0 15px var(--red)}
.df-g{color:var(--green);font-size:clamp(1.8rem,7vw,2.8rem);text-shadow:0 0 15px var(--green)}
.hp-pop{position:fixed;z-index:600;font-family:'Rajdhani',sans-serif;font-size:clamp(.85rem,3vw,1.05rem);font-weight:700;pointer-events:none;animation:fup2 1.2s ease-out forwards}
@keyframes fup2{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-22px)}}
.sw{position:fixed;z-index:580;border-radius:50%;pointer-events:none;animation:swA .6s ease-out forwards;will-change:transform,opacity}
@keyframes swA{0%{transform:scale(.1);opacity:.9}100%{transform:scale(5);opacity:0}}
.pt{position:fixed;z-index:585;border-radius:50%;pointer-events:none;animation:ptA var(--dur,.75s) ease-out forwards;will-change:transform,opacity}
@keyframes ptA{0%{transform:translate(0,0)scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty))scale(0);opacity:0}}
.sf{position:fixed;inset:0;z-index:560;pointer-events:none;animation:sfA .5s ease-out forwards}
@keyframes sfA{0%{opacity:.45}100%{opacity:0}}
.bi{position:fixed;bottom:calc(54px + 3rem + .5rem);right:.65rem;z-index:690;pointer-events:none;width:84px;height:120px;border-radius:8px;overflow:hidden;animation:biIn .28s ease-out forwards;will-change:transform,opacity;border:2px solid var(--bi-b,rgba(201,168,76,.5));box-shadow:0 0 22px rgba(0,0,0,.7),0 0 14px var(--bi-g,rgba(201,168,76,.3))}
.bi-art{width:100%;height:calc(100% - 20px);display:flex;align-items:center;justify-content:center;font-size:3.2rem;background:rgba(0,0,0,.3);overflow:hidden}
.bi-art img{width:100%;height:100%;object-fit:cover}
.bi-nm{height:20px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-size:.6rem;font-weight:700;color:#fff;background:rgba(0,0,0,.82);padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes biIn{0%{opacity:0;transform:translateX(18px)scale(.85)}100%{opacity:1;transform:translateX(0)scale(1)}}
.bi.out{animation:biOut .22s ease-in forwards}
@keyframes biOut{0%{opacity:1}100%{opacity:0;transform:translateX(12px)}}
/* Card pick modal */
.cpov{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:1rem}
.cpov-t{font-family:'Rajdhani',sans-serif;font-size:.95rem;font-weight:700;color:var(--gold);margin-bottom:.7rem;text-align:center}
.cpov-s{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;max-height:52vh;overflow-y:auto;padding:.25rem}
.cpov-item{cursor:pointer;border-radius:7px;border:2px solid var(--border);transition:all .18s;touch-action:manipulation}
.cpov-item:hover,.cpov-item:active{border-color:var(--gold);transform:scale(1.05)}
.cpov-cancel{margin-top:.75rem;background:rgba(80,80,100,.28);color:var(--text);border:1px solid rgba(201,168,76,.25);border-radius:7px;padding:.48rem .9rem;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em;cursor:pointer}
/* Game over */
.gop{position:fixed;bottom:0;left:0;right:0;z-index:800;background:rgba(5,5,18,.97);border-top:2px solid var(--gold);padding:.85rem;backdrop-filter:blur(6px);transform:translateY(100%);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.gop.show{transform:translateY(0)}
.gop-title{font-family:'Rajdhani',sans-serif;font-size:clamp(1.2rem,5.5vw,1.7rem);font-weight:700;text-align:center;margin-bottom:.25rem}
.gop-sub{font-family:'Rajdhani',sans-serif;font-size:.85rem;color:var(--text-dim);text-align:center;margin-bottom:.75rem;line-height:1.55}
.gop-btns{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap}
.proc-ov{position:fixed;inset:0;z-index:750;background:transparent;cursor:wait}
.toast{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%) translateY(110px);background:var(--panel);border:1px solid var(--gold);border-radius:7px;padding:.5rem 1rem;font-family:'Rajdhani',sans-serif;font-size:.78rem;letter-spacing:.07em;color:var(--gold);z-index:420;transition:transform .32s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:88vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
/* Card deal animation */
@keyframes dealCard{
  0%{opacity:0;transform:translateY(-40px) scale(.7) rotate(-8deg)}
  60%{opacity:1;transform:translateY(6px) scale(1.05) rotate(1deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotate(0deg)}
}

<body>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,get,set,onValue,remove,update}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const FB={apiKey:"AIzaSyBsASKwkmpRx_vi7JBqC-fvBl3LOgoOtbo",authDomain:"newcard-8fd59.firebaseapp.com",databaseURL:"https://newcard-8fd59-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"newcard-8fd59",storageBucket:"newcard-8fd59.firebasestorage.app",messagingSenderId:"822236707244",appId:"1:822236707244:web:f2a82f612226d7ac3f6209"};
const db=getDatabase(initializeApp(FB));

const roomCode   =localStorage.getItem('roomCode')||'';
const mySlot     =parseInt(localStorage.getItem('mySlot')||'1');
const numP       =parseInt(localStorage.getItem('actualPlayers')||localStorage.getItem('numPlayers')||'2');
const myName     =localStorage.getItem('myName')||'P'+mySlot;
const pNames     =JSON.parse(localStorage.getItem('playerNames')||'{}');
const activeIdStr=localStorage.getItem('activeCardIds')||'all';
const amHost     =localStorage.getItem('isHost')==='true';

const gameRef=roomCode?ref(db,`rooms/${roomCode}/gameState`):ref(db,'gameState_solo');
const cardsRef=ref(db,'sharedCards');
const roomRef=roomCode?ref(db,`rooms/${roomCode}`):null;

const CM={red:{border:'#c0392b',accent:'#e74c3c',glow:'rgba(192,57,43,.4)',cost:'#c0392b',dot:'#e74c3c',fx:'rgba(231,76,60,.85)'},blue:{border:'#2471a3',accent:'#3498db',glow:'rgba(36,113,163,.4)',cost:'#2471a3',dot:'#3498db',fx:'rgba(52,152,219,.85)'},yellow:{border:'#d4ac0d',accent:'#f1c40f',glow:'rgba(212,172,13,.4)',cost:'#d4ac0d',dot:'#f1c40f',fx:'rgba(241,196,15,.85)'},green:{border:'#1e8449',accent:'#2ecc71',glow:'rgba(30,132,73,.4)',cost:'#1e8449',dot:'#2ecc71',fx:'rgba(46,204,113,.85)'}};
const CN={red:'赤',blue:'青',yellow:'黄',green:'緑'};
const WEATHERS=[{id:'sun',icon:'☀️',name:'晴れ',eff:'カードDEF+1'},{id:'rain',icon:'🌧️',name:'雨',eff:'コスト-1(最低1)'},{id:'storm',icon:'⛈️',name:'嵐',eff:'全ATK+2'}];

// ★ すべてモジュールレベル変数（クロージャ問題なし）
let G=null,pool=[],poolMap={};
let processing=false,selCard=-1,navigating=false,gameOverShown=false;
let gameStarted=false;
let creatingState=false;
const newCards=new Set();

const wData=id=>WEATHERS.find(w=>w.id===id)||WEATHERS[0];
const COLOR_NAMES={red:'赤',blue:'青',yellow:'黄',green:'緑'};
const getColors=c=>{
  if(!c)return['red'];
  // Firebaseから配列が来た場合
  if(Array.isArray(c.colors)&&c.colors.length)return c.colors;
  // Firebaseが配列をオブジェクトに変換した場合: {0:'red',1:'blue'}
  if(c.colors&&typeof c.colors==='object'){
    const vals=Object.values(c.colors).filter(v=>typeof v==='string');
    if(vals.length)return vals;
  }
  // 文字列の場合
  if(typeof c.colors==='string'&&c.colors)return[c.colors];
  // color(単数)フォールバック
  return[c.color||'red'];
};
const mainC=c=>CM[getColors(c)[0]]||CM.red;
const clone=o=>JSON.parse(JSON.stringify(o));
const SL=(p,m)=>{document.getElementById('loadFill').style.width=p+'%';document.getElementById('loadMsg').textContent=m;};
const showGame=()=>{document.getElementById('loadScr').style.display='none';document.getElementById('gameApp').style.display='flex';};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);};
const pLabel=slot=>`P${slot}「${pNames[slot]||('P'+slot)}」`;
const LOG_LIMIT=32,SAVE_TIMEOUT=8500,CARD_CACHE_LIMIT=1600000;
const LOW_FX=matchMedia('(max-width:760px)').matches||(navigator.deviceMemory&&navigator.deviceMemory<=4)||matchMedia('(prefers-reduced-motion: reduce)').matches;
const HOVER_TIPS=matchMedia('(hover:hover) and (pointer:fine)').matches&&!LOW_FX;
let renderQueued=false;
const renderCache={wx:'',opps:'',bf:'',hand:'',log:''};
let netStatusTimer=null;
const cardKey=c=>c?[c.id,c.name,c.cost,c.atk,c.def,JSON.stringify(c.colors||c.color||''),(c.effects||[]).length,c.illust?String(c.illust).slice(0,32):''].join(':'):'';
function queueRender(){
  if(renderQueued)return;
  renderQueued=true;
  requestAnimationFrame(()=>{renderQueued=false;renderAll();});
}
const logMsg=(S,type,msg)=>{S.log=S.log||[];S.log.push(`${type}|${msg}`);if(S.log.length>LOG_LIMIT)S.log=S.log.slice(-LOG_LIMIT);};
function setNetStatus(msg,type='warn',auto=0){
  const el=document.getElementById('netStatus');if(!el)return;
  clearTimeout(netStatusTimer);el.textContent=msg;el.className=`net-status show ${type}`;
  if(auto)netStatusTimer=setTimeout(()=>el.classList.remove('show'),auto);
}
function withTimeout(p,ms,msg='timeout'){
  let tid;
  const to=new Promise((_,rej)=>{tid=setTimeout(()=>rej(new Error(msg)),ms);});
  return Promise.race([p,to]).finally(()=>clearTimeout(tid));
}
function nextDefenderSlot(S){if(!S?.seq?.length)return null;return S.seq[(S.seqIdx+1)%S.seq.length]?.player||null;}

function setPool(cards){pool=cards;poolMap={};cards.forEach(c=>{if(c.id)poolMap[c.id]=c;});}
function applyPool(cards){let p=cards||[];if(activeIdStr&&activeIdStr!=='all'){try{const s=new Set(JSON.parse(activeIdStr));p=cards.filter(c=>s.has(c.id));}catch(e){}}setPool(p.length?p:(cards?.length?cards:[]));}
function activeIds(){if(!activeIdStr||activeIdStr==='all')return null;try{const ids=JSON.parse(activeIdStr);return Array.isArray(ids)?ids.filter(Boolean):null;}catch(e){return null;}}
function readCardCache(){
  try{
    const cd=localStorage.getItem('cardrealmDeck');
    if(!cd||cd.length>CARD_CACHE_LIMIT)return[];
    const cards=JSON.parse(cd);
    return Array.isArray(cards)?cards:[];
  }catch(e){return[];}
}
function writeCardCache(cards){
  try{
    const txt=JSON.stringify(cards);
    if(txt.length<CARD_CACHE_LIMIT)localStorage.setItem('cardrealmDeck',txt);
  }catch(e){}
}
async function loadSharedCards(){
  const ids=activeIds();
  try{
    setNetStatus('カードを同期中...','warn');
    let cards=[];

// ★ Firebaseから受け取ったデータを正規化
// 文字列キー形式 → 数値キーのオブジェクトに戻す
function normalizeState(S){
  if(!S)return S;

  // ── players の正規化 ──
  // 'slot_1','slot_2'キー → {1:{...},2:{...}}
  // 's1','s2'キー（旧形式）→ {1:{...},2:{...}}
  // 配列形式 → {1:{...},2:{...}}
  // 数値文字列キー → そのまま数値化
  const norm={};
  if(Array.isArray(S.players)){
    S.players.forEach((p,i)=>{if(p&&i>0)norm[i]=p;});
  } else if(S.players){
    for(const[k,v]of Object.entries(S.players)){
      if(!v)continue;
      let num;
      if(k.startsWith('slot_'))num=parseInt(k.slice(5));
      else if(k.startsWith('s'))num=parseInt(k.slice(1));
      else num=parseInt(k);
      if(!isNaN(num)&&num>0)norm[num]=v;
    }
  }
  S.players=norm;

  // ── seq の正規化 ──
  // 'seq_0','seq_1'キー → 配列
  // 'i0','i1'キー（旧形式）→ 配列
  // 配列 → そのまま
  if(!Array.isArray(S.seq)){
    const len=S.seqLen||Object.keys(S.seq||{}).length;
    const arr=[];
    for(let i=0;i<len;i++){
      const item=S.seq?.['seq_'+i]||S.seq?.['i'+i];
      if(item)arr.push(item);
    }
    S.seq=arr;
  }

  // ── カードの colors 正規化（共通） ──
  function fixCardColors(card){
    if(!card)return;
    if(card.colors&&typeof card.colors==='object'&&!Array.isArray(card.colors)){
      card.colors=Object.values(card.colors).filter(v=>typeof v==='string');
    }
    if(!card.colors||!Array.isArray(card.colors)||!card.colors.length){
      card.colors=[card.color||'red'];
    }
  }
  // 手札
  for(const p of Object.values(S.players||{})){
    for(const card of(p.hand||[]))fixCardColors(card);
  }
  // フィールド上のカード
  fixCardColors(S.discardCard);
  fixCardColors(S.atkCardPlayed);
  fixCardColors(S.defCardPlayed);
  return S;
}

function rehydrateState(S){
  if(!S)return S;
  normalizeState(S);// まず正規化
  for(const p of Object.values(S.players||{}))(p.hand||[]).forEach(rehydrate);
  rehydrate(S.atkCardPlayed);rehydrate(S.defCardPlayed);rehydrate(S.discardCard);
  return S;
}

function getEffects(card){return card?.effects?.length?card.effects:(card?.effect&&(card.effect.trigger||card.effect.type)?[{trigger:card.effect.trigger,eff:card.effect.type||'',effVal:card.effect.value,condVal:3}]:[]);}
const COND_TRIGS=['ifHpLow','ifHpHigh','ifChance','ifWeatherSun','ifWeatherRain','ifWeatherStorm','ifTurnGte','ifAgainstColor'];
function conditionPasses(cond,S,slot,opts={}){
  const tr=cond.playCond||cond.trigger||'',cv=+cond.condVal||3,p=S.players?.[slot];
  if(!tr)return true;
  if(tr==='ifHpLow')return(p?.hp||0)<=cv;
  if(tr==='ifHpHigh')return(p?.hp||0)>=cv;
  if(tr==='ifChance')return opts.rollChance===false?true:Math.random()*100<=cv;
  if(tr==='ifWeatherSun')return S.weather?.current==='sun';
  if(tr==='ifWeatherRain')return S.weather?.current==='rain';
  if(tr==='ifWeatherStorm')return S.weather?.current==='storm';
  if(tr==='ifTurnGte')return(S.turnCount||0)>=cv;
  if(tr==='ifAgainstColor'){
    const col=cond.condColor||cond.targetColor||'red';
    const c=S.seq?.[S.seqIdx%S.seq.length];
    const against=c?.phase==='defend'?S.atkCardPlayed:S.discardCard;
    return !!against&&getColors(against).includes(col);
  }

}
function effectMatches(e,S,slot,trig,opts={}){
  const tr=e.trigger||'';
  if(tr==='playCondition')return false;
  if(!tr)return trig==='onPlay';
  if(COND_TRIGS.includes(tr))return trig==='onPlay'&&conditionPasses(e,S,slot,opts);

}

  if(c?.phase==='defend'){
    if(slot===S.lastAtkPlayer)return c.player;
    if(slot===c.player&&S.lastAtkPlayer)return S.lastAtkPlayer;
  }
  if(c?.phase==='attack')return S.seq?.[(S.seqIdx+1)%S.seq.length]?.player;
  for(let i=1;i<=S.numP;i++)if(i!==slot&&S.players[i]?.alive!==false)return i;
  return null;
}
function canPlay(card,S,opts={}){S=S||G;const me=S.players[mySlot];if(!me)return false;if((me.cost||0)<wCost(card,S))return false;const d=S.discardCard;if(d){

const ED={draw:n=>`${n}枚ドロー`,drawColor:n=>`指定色${n}枚ドロー`,drawCard:()=>`指定カード`,selfHeal:n=>`自HP+${n}`,selfDamage:n=>`自-${n}ダメ`,selfAtkUp:n=>`手札ATK+${n}`,selfDefUp:n=>`手札DEF+${n}`,selfCardAtkUp:n=>`カードATK+${n}`,selfCardDefUp:n=>`カードDEF+${n}`,oppDamage:n=>`相+${n}ダメ`,selfCostDown:n=>`次コスト-${n}`,selfCostUp:n=>`自コスト+${n}`,selfCostLose:n=>`自コスト-${n}`,oppCostDown:n=>`相コスト-${n}`,oppAtkDown:n=>`相ATK-${n}`,oppDefDown:n=>`相DEF-${n}`,weatherSun:()=>'→☀️',weatherRain:()=>'→🌧️',weatherStorm:()=>'→⛈️',weatherChange:()=>'天候変化',buffAtk:n=>`手札ATK+${n}`,buffDef:n=>`手札DEF+${n}`,heal:n=>`自HP+${n}`,damage:n=>`相+${n}ダメ`,costReduce:n=>`次コスト-${n}`,costGain:n=>`自コスト+${n}`};
const TS={onAttack:'攻撃時',onDefend:'防御時',onPlay:'出した時',onDamage:'ダメ与',onTakeDmg:'被ダメ',ifHpLow:'HP≤n',ifHpHigh:'HP≥n',ifChance:'n%',ifWeatherSun:'晴れ',ifWeatherRain:'雨',ifWeatherStorm:'嵐',ifTurnGte:'T≥n',ifAgainstColor:'指定色に対して',playCondition:'★出し条件'};
const PS={ifHpLow:'HP≤n',ifHpHigh:'HP≥n',ifChance:'n%',ifWeatherSun:'晴れ時',ifWeatherRain:'雨時',ifWeatherStorm:'嵐時',ifTurnGte:'T≥n',ifAgainstColor:'指定色に対して'};

function needsHandPick(card,S){
  const phaseTrig=ph(S)==='attack'?'onAttack':'onDefend';
  return getEffects(card).some(e=>{

    const tr=e.trigger||'';
    if(COND_TRIGS.includes(tr))return conditionPasses(e,S,mySlot,{rollChance:false});

function applySelfCardMods(source,played,S,slot,trig){
  for(const e of getEffects(source)){

    const ek=e.eff||e.type||'',ev=+e.effVal||+e.value||1;
    if(ek==='selfCardAtkUp'){played.atk=(played.atk||0)+ev;logMsg(S,'eff',`効果: ${pLabel(slot)}「${source.name||'?'}」で「${played.name||'?'}」ATK +${ev}`);}

  }
}

function applyEff(card,S,slot,trig,pickIdx){
  if(!card)return;
  for(const e of getEffects(card)){
    if(!effectMatches(e,S,slot,trig))continue;
    const ek=e.eff||e.type||'',ev=+e.effVal||+e.value||1;
    const p=S.players[slot];if(!p)continue;
    const os=effectTargetSlot(S,slot,trig),op=os?S.players[os]:null;
    const actor=pLabel(slot),target=os?pLabel(os):'相手';
    switch(ek){
      case'draw':
        for(let i=0;i<ev;i++)addDrawnCard(p,drawCard(),'効果ドロー');
        logMsg(S,'eff',`効果: ${actor}「${card.name||'?'}」 ${ev}枚ドロー`);
        break;
      case'drawColor':{
        const col=e.targetColor||'red';
        for(let i=0;i<ev;i++)addDrawnCard(p,drawColorCard(col),`${COLOR_NAMES[col]||'指定色'}ドロー`);
        logMsg(S,'eff',`効果: ${actor}「${card.name||'?'}」 ${COLOR_NAMES[col]||'指定色'}カードを${ev}枚ドロー`);
        break;
      }
      case'drawCard':{
        const d=drawSpecificCard(e.targetCardId);
        if(addDrawnCard(p,d,'指定カード'))logMsg(S,'eff',`効果: ${actor}「${card.name||'?'}」 「${d.name||e.targetCardName||'指定カード'}」をドロー`);
        break;
      }
      case'selfHeal':case'heal':
        p.hp=Math.min(p.maxHp,(p.hp||0)+ev);
        logMsg(S,'heal',`回復: ${actor}「${card.name||'?'}」 HP +${ev}`);
        break;
      case'selfDamage':
        p.hp=Math.max(0,(p.hp||0)-ev);
        logMsg(S,'dmg',`自傷: ${actor}「${card.name||'?'}」 ${ev}ダメージ`);
        break;
      case'selfAtkUp':case'buffAtk':{
        const i=handPickIndex(p,pickIdx);
        if(i>=0){p.hand[i].atk=(p.hand[i].atk||0)+ev;logMsg(S,'eff',`効果: ${actor}の手札「${p.hand[i].name||'?'}」ATK +${ev}`);}
        break;
      }
      case'selfDefUp':case'buffDef':{
        const i=handPickIndex(p,pickIdx);
        if(i>=0){p.hand[i].def=(p.hand[i].def||0)+ev;logMsg(S,'eff',`効果: ${actor}の手札「${p.hand[i].name||'?'}」DEF +${ev}`);}
        break;
      }
      case'selfCardAtkUp':case'selfCardDefUp':break;
      case'oppDamage':case'damage':
        if(op){op.hp=Math.max(0,(op.hp||0)-ev);logMsg(S,'dmg',`効果ダメージ: ${actor}「${card.name||'?'}」 → ${target} に ${ev}ダメージ`);}
        break;
      case'selfCostDown':case'costReduce':
        p._cB=(p._cB||0)+ev;logMsg(S,'eff',`効果: ${actor} 次に出すカードのコスト -${ev}`);
        break;
      case'selfCostUp':case'costGain':
        p.cost=(p.cost||0)+ev;logMsg(S,'eff',`効果: ${actor} コスト +${ev}`);
        break;
      case'selfCostLose':
        p.cost=Math.max(0,(p.cost||0)-ev);logMsg(S,'eff',`デメリット: ${actor} コスト -${ev}`);
        break;
      case'oppCostDown':
        if(op){op.cost=Math.max(0,(op.cost||0)-ev);logMsg(S,'eff',`効果: ${actor} → ${target} コスト -${ev}`);}
        break;
      case'oppAtkDown':
        if(op){op._nAtkD=(op._nAtkD||0)+ev;logMsg(S,'eff',`効果: ${actor} → ${target} 次ATK -${ev}`);}
        break;
      case'oppDefDown':
        if(op){op._nDefD=(op._nDefD||0)+ev;logMsg(S,'eff',`効果: ${actor} → ${target} 次DEF -${ev}`);}
        break;
      case'weatherSun':setWx(S,'sun');break;
      case'weatherRain':setWx(S,'rain');break;
      case'weatherStorm':setWx(S,'storm');break;
      case'weatherChange':{const a=['sun','rain','storm'].filter(w=>w!==S.weather.current);setWx(S,a[~~(Math.random()*a.length)]||'sun');}break;
    }
  }
}

function genDefault(){const cols=[['red'],['blue'],['yellow'],['green'],['red','blue'],['yellow','green']];const nms=['騎士','魔法使い','竜','妖精','戦士','弓使い','僧侶','忍者','海賊','錬金術師','天使','悪魔','剣士','盗賊','召喚士','聖騎士','魔剣士','竜騎士','幻術師','召喚魔法'];const ils=['⚔️','🔮','🐉','🦋','🛡️','🏹','✨','🌸','🗡️','🧪','👼','😈','⚡','🗺️','📖','🏰','🌙','🦅','🌀','🔥'];return nms.map((nm,i)=>({id:'def'+i,name:nm,colors:cols[i%cols.length],color:cols[i%cols.length][0],cost:1+~~(i/4),atk:2+(i%5),def:1+(i%4),illust:ils[i],flavor:'',effects:[],vfx:[]}));}
function buildState(n){if(!pool.length)return null;let order=Array.from({length:n},(_,i)=>i+1);for(let i=order.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}const seq=[];for(let oi=0;oi<order.length;oi++){seq.push({player:order[oi],phase:'attack'});seq.push({player:order[(oi+1)%order.length],phase:'defend'});}const players={};for(let oi=0;oi<order.length;oi++){const slot=order[oi];const hand=Array.from({length:oi===0?7:8},()=>drawCard()).filter(Boolean);if(slot===mySlot)hand.forEach((_,i)=>newCards.add('i'+i));players[slot]={hp:20,maxHp:20,cost:2,_cB:0,_nAtkD:0,_nDefD:0,hand,alive:true};}const fp=seq[0].player;if(players[fp])players[fp].cost=(players[fp].cost||0)+3;return{status:'playing',numP:n,seqIdx:0,seq,players,discardCard:null,atkCardPlayed:null,defCardPlayed:null,playedThisTurn:false,turnCount:0,weather:{current:'sun',changeCount:0,defendsDone:0},log:[`info|ゲーム開始: 先攻は${pLabel(fp)}`,`turn|ターン: ${pLabel(fp)}の攻撃（コスト +3）`]};}

async function ensureGameState(){
  if(!amHost||gameStarted||creatingState)return;
  creatingState=true;
  try{
    const existing=await get(gameRef);
    if(existing.exists())return;
    if(!pool.length){toast('カードが読み込めません。カード作成画面でカードを確認してください');setNetStatus('カードがないため開始できません','err',5000);return;}
    const ns=buildState(numP);
    if(ns)await save(ns);
  }catch(e){
    console.error('ensureGameState fail:',e);
    toast('試合データの作成に失敗しました');
  }finally{
    creatingState=false;
  }
}

function compactCard(c){
  if(!c)return c;
  const o={};
  ['id','name','colors','color','cost','atk','def','flavor','effects','vfx','vfxText','illust','author'].forEach(k=>{if(c[k]!==undefined)o[k]=c[k];});
  if(o.illust&&typeof o.illust==='string'&&o.illust.startsWith('data:'))o.illust='[img]';
  return o;
}
function compactPlayer(p){
  if(!p)return p;
  const out={...p};
  out.hand=(p.hand||[]).map(compactCard);
  return out;
}

async function save(S){
  let slim;
  try{
    slim=clone(S);
    slim.log=(slim.log||[]).slice(-LOG_LIMIT);

    // ★ playersを正規化してから文字列キーへ変換
    // S.playersが配列の場合も数値キーオブジェクトに正規化してから変換
    let playersNorm={};
    if(Array.isArray(slim.players)){
      // 配列: [null, P1, P2] → {1:P1, 2:P2}
      slim.players.forEach((p,i)=>{if(p&&i>0)playersNorm[i]=p;});
    } else {
      // オブジェクト: キーが's1'等なら数値に戻してから再変換
      for(const[k,v]of Object.entries(slim.players||{})){
        if(!v)continue;
        const num=k.startsWith('s')?parseInt(k.slice(1)):parseInt(k);
        if(!isNaN(num)&&num>0)playersNorm[num]=v;
      }
    }
    // playersを 'slot_1', 'slot_2' キーで保存（Firebaseの配列変換を確実に防ぐ）
    const playersOut={};
    for(const[k,v]of Object.entries(playersNorm))playersOut['slot_'+k]=compactPlayer(v);
    slim.players=playersOut;

    // seqを配列から 'seq_0','seq_1'... キーのオブジェクトに変換
    const seqArr=Array.isArray(slim.seq)?slim.seq:Object.values(slim.seq||{});
    const seqOut={};
    seqArr.forEach((s,i)=>{if(s)seqOut['seq_'+i]=s;});
    slim.seq=seqOut;
    slim.seqLen=seqArr.length;

    slim.atkCardPlayed=compactCard(slim.atkCardPlayed);
    slim.defCardPlayed=compactCard(slim.defCardPlayed);
    slim.discardCard=compactCard(slim.discardCard);
    setNetStatus('試合データを同期中...','warn');
    await withTimeout(set(gameRef,slim),SAVE_TIMEOUT,'save-timeout');
    setNetStatus('同期済み','ok',1200);
  }catch(e){
    console.error('save fail:',e.message);
    setNetStatus('通信が不安定です。再同期中...','err');
    // 1回だけリトライ
    if(slim)try{await withTimeout(set(gameRef,slim),4000,'save-retry-timeout');setNetStatus('同期済み','ok',1400);}catch(e2){console.error('save retry fail:',e2.message);toast('通信が遅いです。少し待ってから操作してください');setNetStatus('通信が不安定です。再読み込みせず少し待ってください','err',5000);}
  }
}

// ★ onGameRef: モジュールレベルのコールバック
//   gameStarted がモジュール変数なのでクロージャ問題なし
// ══════════════════════════════════════════
function onGameRef(snap){
  const ng=snap.val();

  if(!gameStarted){
    if(ng){
      gameStarted=true;
      G=rehydrateState(ng);
      // 手札配布アニメーション
      const myHand=G.players?.[mySlot]?.hand||[];
      myHand.forEach((_,i)=>newCards.add('i'+i));
      SL(100,'開始！');
      showGame();
      queueRender();
      dealStartFx(myHand.length);
      if(G.status==='over')showGameOver(G);
    } else if(amHost){
      ensureGameState();
    }
    return;
  }

  if(!ng)return;

  // 古いデータを無視（turnCountが現在より小さい場合）
  if(G&&(ng.turnCount||0)<(G.turnCount||0))return;

  const changed=ng.seqIdx!==G?.seqIdx||ng.turnCount!==G?.turnCount;
  if(changed)selCard=-1;
  G=rehydrateState(ng);
  queueRender();
  if(G.status==='over')showGameOver(G);
  else checkWin();
}

function init(){
  SL(20,'カードを読み込み中...');

  let cachedCards=readCardCache();
  applyPool(cachedCards.length?cachedCards:[]);

  const cardsReady=loadSharedCards();

  SL(50,'接続中...');
  onValue(ref(db,'.info/connected'),snap=>{
    if(snap.val()===false)setNetStatus('オフラインまたは通信待ちです','err');
    else setNetStatus('接続しました','ok',1200);
  });

  if(amHost){
    SL(60,'ゲームを準備中...');
    const delay=cachedCards.length?300:2000;
    setTimeout(async()=>{
      if(gameStarted)return;
      await Promise.race([cardsReady,new Promise(r=>setTimeout(r,2500))]);
      await ensureGameState();
    },delay);
  } else {
    SL(60,'ホストの試合開始を待っています...');
  }

  onValue(gameRef,onGameRef);

  if(roomRef){
    onValue(roomRef,snap=>{
      if(!snap.exists()||navigating)return;
      const room=snap.val();
      if(room.action==='home'){navigating=true;update(roomRef,{action:null}).catch(()=>{});setTimeout(()=>{window.location.href='index.html';},300);}
      else if(room.action==='rematch'){update(roomRef,{action:null}).catch(()=>{});gameOverShown=false;gameStarted=false;document.getElementById('gop').classList.remove('show');if(amHost&&pool.length){const ns=buildState(numP);if(ns)save(ns);}}
    });
  }
}

window.selCardFn=function(i){if(processing)return;if(!myTurn()){toast('あなたのターンではありません');return;}if(G.playedThisTurn){toast('今ターンはすでにカードを出しました');return;}const card=G.players[mySlot]?.hand?.[i];if(!card)return;if(selCard===i){selCard=-1;renderHand();updBtn();return;}if(!canPlay(card)){toast(G.discardCard?'出せません（同色/同コスト または出し条件未達）':'コスト不足か出し条件未達');return;}selCard=i;renderHand();updBtn();};

window.playCard=async function(){
  if(processing||selCard<0||!myTurn()||G.playedThisTurn)return;
  lock();
  try{
    const me=G.players[mySlot];const card=me.hand?.[selCard];if(!card){unlock();return;}
    const S=clone(G);
    if(!canPlay(card,S,{rollChance:true})){toast('出し条件を満たせませんでした');unlock();return;}
    let pickIdx=-1;
    const needPick=needsHandPick(card,S);
    if(needPick&&me.hand.length>1){const other=me.hand.filter((_,i)=>i!==selCard);const pi=await pickCard(other,'強化する手札を選択');if(pi<0){toast('カード選択をキャンセルしました');unlock();return;}pickIdx=pi>=selCard?pi+1:pi;}
    const p=S.players[mySlot];
    const pc={...card};
    if(p._nAtkD){pc.atk=Math.max(0,(pc.atk||0)-p._nAtkD);p._nAtkD=0;}
    if(p._nDefD){pc.def=Math.max(0,(pc.def||0)-p._nDefD);p._nDefD=0;}
    applySelfCardMods(card,pc,S,mySlot,'onPlay');
    applySelfCardMods(card,pc,S,mySlot,ph(S)==='attack'?'onAttack':'onDefend');
    const fc=Math.max(1,wCost(card,S)-(p._cB||0));
    if((p.cost||0)<fc){toast('コスト不足');unlock();return;}
    p.cost-=fc;p._cB=0;p.hand.splice(selCard,1);const effPickIdx=pickIdx>selCard?pickIdx-1:pickIdx;S.playedThisTurn=true;S.discardCard=clone(pc);
    if(ph(S)==='attack'){
      S.atkCardPlayed=clone(pc);S.defCardPlayed=null;S.lastAtkPlayer=mySlot;
      const target=nextDefenderSlot(S);
      logMsg(S,'turn',`攻撃: ${pLabel(mySlot)} → ${target?pLabel(target):'相手'} / 「${pc.name||'?'}」 ATK ${wAtk(pc,S)}`);
      applyEff(pc,S,mySlot,'onPlay',effPickIdx);applyEff(pc,S,mySlot,'onAttack',effPickIdx);
    }
    else{
      S.defCardPlayed=clone(pc);const ak=S.atkCardPlayed;
      if(ak){
        const av=wAtk(ak,S),dv=wDef(pc,S),dmg=Math.max(0,av-dv),att=S.lastAtkPlayer||'?';
        if(dmg>0){
          p.hp=Math.max(0,p.hp-dmg);
          logMsg(S,'dmg',`ダメージ: ${pLabel(att)} → ${pLabel(mySlot)} / 「${ak.name||'?'}」ATK ${av} vs 「${pc.name||'?'}」DEF ${dv} = ${dmg}ダメージ`);
          setTimeout(()=>atkFx(ak,dmg,false),150);applyEff(ak,S,S.lastAtkPlayer,'onDamage',-1);applyEff(pc,S,mySlot,'onTakeDmg',effPickIdx);
        }else{
          logMsg(S,'dmg',`ブロック: ${pLabel(mySlot)} が「${pc.name||'?'}」DEF ${dv}で ${pLabel(att)}の攻撃を防御`);
          setTimeout(()=>atkFx(ak,0,true),150);
        }
      }
      applyEff(pc,S,mySlot,'onPlay',effPickIdx);applyEff(pc,S,mySlot,'onDefend',effPickIdx);S.atkCardPlayed=null;wxTick(S);
    }
    const dr=drawCard();if(dr){addDrawnCard(p,dr,'ターンドロー');logMsg(S,'info',`${pLabel(mySlot)} 1枚ドロー`);}
    vfx(pc);selCard=-1;G=S;renderAll();checkWin();
    await save(S);
    const snapTc=S.turnCount,snapSi=S.seqIdx;
    setTimeout(async()=>{
      // turnCountとseqIdxが変わっていなければ自動ターン終了
      if(!G||G.turnCount!==snapTc||G.seqIdx!==snapSi)return;
      if(!myTurn()||!G.playedThisTurn)return;
      processing=false;// 念のためprocessingをリセット
      lock();
      try{await endTurnInt();}
      catch(e){console.warn('autoEndTurn error:',e);}
      finally{unlock();}
    },900);
  }catch(e){console.error('playCard:',e);toast('エラー: '+e.message);}
  finally{unlock();}
};

window.extraDraw=async function(){if(processing||!myTurn()||ph()!=='attack'||G.playedThisTurn)return;lock();try{const S=clone(G);const p=S.players[mySlot];if((p.hp||0)<=2){toast('HP2消費できません');return;}const card=drawW(p.hand);if(!card){toast('プールが空です');return;}p.hp-=2;addDrawnCard(p,card,'追加ドロー');logMsg(S,'info',`${pLabel(mySlot)} HP-2で追加ドロー`);G=S;renderAll();await save(S);toast('ドロー！');}finally{unlock();}};
window.endTurn=async function(){if(!myTurn())return;if(processing)unlock();lock();try{await endTurnInt();}finally{unlock();}};
async function endTurnInt(){if(!myTurn())return;const S=clone(G);const c=S.seq[S.seqIdx%S.seq.length];if(c.phase==='defend'&&!S.playedThisTurn){const ak=S.atkCardPlayed;if(ak){const av=wAtk(ak,S),att=S.lastAtkPlayer||'?';if(av>0){S.players[c.player].hp=Math.max(0,(S.players[c.player].hp||0)-av);logMsg(S,'dmg',`ガードなし: ${pLabel(att)} → ${pLabel(c.player)} に ${av}ダメージ`);setTimeout(()=>atkFx(ak,av,false),50);applyEff(ak,S,S.lastAtkPlayer,'onDamage',-1);}}}if(c.phase==='defend'){S.atkCardPlayed=null;S.defCardPlayed=null;wxTick(S);}for(let i=1;i<=S.numP;i++){if(S.players[i]&&(S.players[i].hp||0)<=0&&S.players[i].alive!==false){S.players[i].alive=false;logMsg(S,'dmg',`脱落: ${pLabel(i)}`);}}let nx=(S.seqIdx+1)%S.seq.length;for(let sf=0;sf<S.seq.length*2;sf++){if(S.players[S.seq[nx%S.seq.length].player]?.alive!==false)break;nx=(nx+1)%S.seq.length;}S.seqIdx=nx%S.seq.length;S.playedThisTurn=false;S.turnCount=(S.turnCount||0)+1;const next=S.seq[S.seqIdx%S.seq.length];const np=S.players[next.player];if(np){np.cost=(np.cost||0)+3;logMsg(S,'turn',`ターン: ${pLabel(next.player)}の${next.phase==='attack'?'攻撃':'防御'}（コスト +3）`);}selCard=-1;G=S;renderAll();checkWin();await save(S);}

function checkWin(){
  if(!G||G.status!=='playing')return false;
  // normalizeState後のplayersは数値キーオブジェクト
  const alive=[];
  for(let i=1;i<=G.numP;i++){
    const p=G.players[i]||G.players['slot_'+i];
    if(p&&(p.hp||0)<=0&&p.alive!==false){p.alive=false;logMsg(G,'dmg',`脱落: ${pLabel(i)}`);}
    if(p&&p.alive!==false&&(p.hp||0)>0)alive.push(i);
  }
  if(alive.length>1)return false;
  G.status='over';G.winnerSlots=alive;G.endedAt=G.endedAt||Date.now();
  showGameOver(G);
  return true;
}
function showGameOver(S){
  if(!S||gameOverShown)return;
  gameOverShown=true;
  const alive=S.winnerSlots||[];
  const win=alive.includes(mySlot)||alive.length===0;
  const nm=alive.length?alive.map(i=>pNames[i]||'P'+i).join('・'):'引き分け';
  document.getElementById('gopTitle').textContent=win?'🏆 勝利！':'💀 敗北';
  document.getElementById('gopTitle').style.color=win?'var(--gold)':'var(--red)';
  document.getElementById('gopSub').innerHTML=`${nm} の勝利！<br><small style="opacity:.6">${S.log?.[S.log.length-1]||''}</small>`;
  setTimeout(()=>document.getElementById('gop').classList.add('show'),600);
}

function ill(card){const i=card?.illust;if(i&&i!=='[img]'&&(i.startsWith('http')||i.startsWith('data:')))return`<img src="${i}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:contain;background:#0d1018" onerror="this.style.display='none'">`;return(i&&i!=='[img]')?i:'🃏';}
function showCdp(ev,card){
  const d=document.getElementById('cdp');if(!d||!card)return;
  const av=wAtk(card),sk=cskills(card),cols=getColors(card).map(x=>CN[x]||x).join('/');
  document.getElementById('cdpName').textContent=card.name||'?';
  document.getElementById('cdpStats').textContent='['+cols+'] コスト:'+(card.cost||1)+' ATK:'+av+' DEF:'+wDef(card);
  document.getElementById('cdpSk').textContent=sk.join('\n')||'スキルなし';
  document.getElementById('cdpFl').textContent=card.flavor||'';
  d.style.display='block';
  const dw=258;
  d.style.left=Math.min((ev.clientX||0)+14,innerWidth-dw-8)+'px';
  d.style.top=Math.max((ev.clientY||0)-150,8)+'px';
}
function hideCdp(){const d=document.getElementById('cdp');if(d)d.style.display='none';}
function gc2(card,sel,stat){if(!card)return'';const cols=getColors(card);const mc=mainC(card);const av=wAtk(card),dv=wDef(card);const cs=cols.map(c=>`<div class="gc-cs-seg" style="background:${CM[c]?.dot||'#888'}"></div>`).join('');const sk=cskills(card);return`<div class="gc${sel?' sel':''}${stat?' static-card':''}" title="${(card.name||'?')+' ['+getColors(card).map(x=>CN[x]||x).join('/')+'] C'+(card.cost||1)+' ATK:'+av+' DEF:'+dv+(sk.length?' | '+sk.join(' | '):'')+' '+((card.flavor||'')).slice(0,30)}" style="border-color:${mc.border};box-shadow:${sel?'0 0 12px '+mc.glow:stat?'0 0 7px '+mc.glow:'none'}">${sk.length?'<div class="gc-sdot"></div>':''}<div class="gc-cs">${cs}</div><div class="gc-head"><div class="gc-cost" style="background:${mc.cost}">${card.cost||1}</div><div class="gc-name">${card.name||'?'}</div></div><div class="gc-art">${ill(card)}</div><div class="gc-stats"><span style="color:${av!==(card.atk||0)?'#f1c40f':mc.accent}">⚔${av}</span><span style="color:${dv!==(card.def||0)?'#f1c40f':mc.accent}">🛡${dv}</span></div><div class="gc-flavor">${card.flavor?`<div class="gc-ft">${card.flavor}</div>`:''}${sk.map(s=>`<div class="gc-sl">${s}</div>`).join('')}</div></div>`;}
function renderAll(){
  if(!G)return;
  rStat();rWx();rOpps();rBF();renderHand();rLog();updBtn();
  if(HOVER_TIPS)setTimeout(()=>{
    document.querySelectorAll('.static-card').forEach(el=>{
      if(el._cdpDone)return;el._cdpDone=true;
      el.addEventListener('mouseenter',ev=>{
        const t=el.getAttribute('title')||'';if(!t)return;
        const d=document.getElementById('cdp');if(!d)return;
        const parts=t.split(' | ');
        document.getElementById('cdpName').textContent=parts[0]||'';
        document.getElementById('cdpStats').textContent=parts[1]||'';
        document.getElementById('cdpSk').textContent=parts.slice(2).join('\n')||'';
        document.getElementById('cdpFl').textContent='';
        d.style.display='block';
        d.style.left=Math.min(ev.clientX+14,innerWidth-268)+'px';
        d.style.top=Math.max(ev.clientY-160,8)+'px';
      });
      el.addEventListener('mouseleave',()=>hideCdp());
    });
  },0);
}
function roleInfo(slot,S=G){const c=cur(S);const p=S.players?.[slot];if(!p||p.alive===false||(p.hp||0)<=0)return{cls:'rp-dead',txt:'脱落'};if(c?.player===slot&&c.phase==='attack')return{cls:'rp-a',txt:'攻撃中'};if(c?.player===slot&&c.phase==='defend')return{cls:'rp-d',txt:'防御中'};return{cls:'rp-w',txt:'待機中'};}
function rStat(){const me=G.players[mySlot];if(!me)return;document.getElementById('myNameDisp').textContent=(pNames[mySlot]||myName)+' 👤';document.getElementById('myHpBar').style.width=Math.max(0,Math.min(100,(me.hp/me.maxHp)*100))+'%';document.getElementById('myHpTxt').textContent=`${me.hp}/${me.maxHp}`;const rb=roleInfo(mySlot);const re=document.getElementById('myRoleBadge');if(re){re.className=`rpill ${rb.cls}`;re.textContent=rb.txt;}const cost=me.cost||0;document.getElementById('myCostNum').textContent=cost;const col=cost>=10?'rgba(241,196,15,.85)':cost>=5?'rgba(201,168,76,.65)':'rgba(201,168,76,.45)';const circ=document.getElementById('myCostCircle');circ.style.borderColor=col;circ.style.boxShadow=cost>=5?`0 0 10px ${col}`:'none';}
function rBanner(){const c=cur();const bn=document.getElementById('turnBanner');const hud=document.getElementById('hudTurn');if(hud)hud.textContent='';if(myTurn()&&ph()==='attack'){bn.className='turn-banner attack';document.getElementById('turnIcon').textContent='⚔️';document.getElementById('turnBannerTxt').textContent='あなたの攻撃ターン — カードを選んで「出す」';}else if(myTurn()&&ph()==='defend'){bn.className='turn-banner defend';document.getElementById('turnIcon').textContent='🛡️';document.getElementById('turnBannerTxt').textContent='あなたの防御ターン — カードを出すかターン終了';}else{bn.className='turn-banner wait';document.getElementById('turnIcon').textContent='⏳';document.getElementById('turnBannerTxt').textContent=`${pLabel(c.player)} の${c.phase==='attack'?'攻撃':'防御'}ターン`;}}
function rHint(){document.getElementById('shint').textContent='';}
function rWx(){const key=[G.weather.current,G.weather.defendsDone,G.numP].join('|');if(renderCache.wx===key)return;renderCache.wx=key;const w=wData(G.weather.current);document.getElementById('wIcon').textContent=w.icon;document.getElementById('wName').textContent=w.name;document.getElementById('wEff').textContent=`${w.eff}`;document.getElementById('wChg').textContent=`あと${Math.max(0,2*G.numP-(G.weather.defendsDone||0))}防御で変化`;}
function rOpps(){const el=document.getElementById('oppsPanel');const rows=[];for(let i=1;i<=G.numP;i++){if(i===mySlot)continue;const p=G.players[i];if(!p)continue;const dead=p.alive===false||(p.hp||0)<=0;const ri=roleInfo(i);const isA=ri.cls==='rp-a',isD=ri.cls==='rp-d';const pct=Math.max(0,Math.min(100,(p.hp/p.maxHp)*100));const nm=pNames[i]||`P${i}`;const fcard=(G.atkCardPlayed&&G.lastAtkPlayer===i)?G.atkCardPlayed:(G.defCardPlayed&&isD?G.defCardPlayed:null);rows.push(`<div class="opp-area${dead?' opp-dead':isA?' oa':isD?' od':''}"><div class="opp-info"><div class="opp-name">${nm}</div><div class="opp-hp-row"><span style="font-size:.7rem">❤️</span><div class="opp-hb-out"><div class="opp-hb-in" style="width:${pct}%"></div></div><div class="opp-hp-txt">${p.hp}/${p.maxHp}</div><div class="rpill ${ri.cls}">${ri.txt}</div></div><div class="opp-cost-c"><div class="occ-l">cost</div><div class="occ-n">${p.cost||0}</div></div></div><div style="display:flex;gap:.3rem;flex-wrap:wrap;align-items:center">${!dead?`<span class="opp-hand-count">手札 ${p.hand?.length||0}枚</span>`:''}${fcard?`<div style="flex-shrink:0">${gc2(fcard,false,true)}</div>`:''}</div></div>`);}const html=rows.join('');if(renderCache.opps!==html){renderCache.opps=html;el.innerHTML=html;}}
function rBF(){const a=G.atkCardPlayed?gc2(G.atkCardPlayed,false,true):'<div class="field-empty">🗡️</div>';const d=G.discardCard?gc2(G.discardCard,false,true):'<div class="discard-none">なし<br>最初は<br>自由</div>';const f=G.defCardPlayed?gc2(G.defCardPlayed,false,true):'<div class="field-empty">🛡️</div>';const key=a+'|'+d+'|'+f;if(renderCache.bf===key)return;renderCache.bf=key;document.getElementById('atkZone').innerHTML=a;document.getElementById('discardZone').innerHTML=d;document.getElementById('defZone').innerHTML=f;}
function renderHand(){const me=G?.players?.[mySlot];const hand=me?.hand||[];const el=document.getElementById('myHand');document.getElementById('handCnt').textContent=`(${hand.length}枚)`;if(!hand.length){if(renderCache.hand!=='empty'){renderCache.hand='empty';el.innerHTML='<div style="color:var(--text-dim);font-size:.76rem;padding:.4rem">手札なし</div>';}return;}const mt=myTurn();const newKey=[...newCards].sort().join(',');const key=[G.turnCount,G.seqIdx,G.playedThisTurn,selCard,mt,ph(),me.cost,me._cB,G.weather.current,newKey,hand.map(cardKey).join(';')].join('|');if(renderCache.hand===key)return;renderCache.hand=key;const sorted=[...hand.map((c,i)=>({card:c,oi:i,playable:mt&&!G.playedThisTurn&&canPlay(c,G,{rollChance:false})}))].sort((a,b)=>(b.playable-a.playable)||((a.card.cost||0)-(b.card.cost||0)));el.innerHTML=sorted.map(({card,oi:i,playable},si)=>{const mc=mainC(card);const cols=getColors(card);const av=wAtk(card),dv=wDef(card);const ec=Math.max(1,wCost(card)-(me._cB||0));const sel=selCard===i;const dim=mt?(!G.playedThisTurn?!playable:true):false;const isNew=newCards.has('i'+i)||newCards.has('n'+i)||newCards.has('i'+si);if(isNew){newCards.delete('i'+i);newCards.delete('n'+i);newCards.delete('i'+si);}const cs=cols.map(c=>`<div class="gc-cs-seg" style="background:${CM[c]?.dot||'#888'}"></div>`).join('');const sk=cskills(card);const hover=HOVER_TIPS?` onmouseenter="showTT(event,${i})" onmouseleave="hideTT()"`:'';return`<div class="gc hand-card${sel?' sel':''}${dim?' dim':''}${isNew?' dealing':''}" style="border-color:${mc.border};box-shadow:${sel?'0 0 16px '+mc.glow+',0 0 28px '+mc.glow.replace('.4','.15'):'none'}" onclick="${mt&&!dim?`selCardFn(${i})`:'void(0)'}"${hover}>${sk.length?'<div class="gc-sdot"></div>':''}<div class="gc-cs">${cs}</div><div class="gc-head"><div class="gc-cost" style="background:${mc.cost};${ec!==card.cost?'outline:2px solid #f1c40f;outline-offset:-1px':''}">${ec}</div><div class="gc-name">${card.name||'?'}</div></div><div class="gc-art">${ill(card)}</div><div class="gc-stats"><span style="color:${av!==(card.atk||0)?'#f1c40f':mc.accent}">⚔${av}</span><span style="color:${dv!==(card.def||0)?'#f1c40f':mc.accent}">🛡${dv}</span></div><div class="gc-flavor">${card.flavor?`<div class="gc-ft">${card.flavor}</div>`:''}${sk.map(s=>`<div class="gc-sl">${s}</div>`).join('')}</div></div>`;}).join('');}
function rLog(){const el=document.getElementById('glog');const src=(G.log||[]).slice(-14).join('\n');if(renderCache.log===src)return;renderCache.log=src;const rows=src.split('\n').filter(Boolean).map(raw=>{let type='info',text=String(raw||'');if(text.includes('|')){const sp=text.split('|');type=sp.shift()||'info';text=sp.join('|');}else if(text.includes('ダメ')||text.includes('ガード')||text.includes('脱落'))type='dmg';else if(text.includes('回復')||text.includes('HP+'))type='heal';else if(text.includes('効果')||text.includes('🌟'))type='eff';else if(text.includes('天候')||text.includes('🌤'))type='weather';else if(text.includes('ターン')||text.includes('攻撃'))type='turn';const label={dmg:'DMG',eff:'EFFECT',turn:'TURN',weather:'WEATHER',heal:'HEAL',info:'INFO'}[type]||'INFO';return`<div class="log-entry log-${type}"><span class="log-tag">${label}</span><span class="log-text">${text}</span></div>`;});el.innerHTML=rows.join('');el.scrollTop=el.scrollHeight;}
function updBtn(){
  const mt=myTurn();
  document.getElementById('btnDraw').disabled=!mt||ph()!=='attack'||G.playedThisTurn;
  document.getElementById('btnPlay').disabled=!mt||selCard<0||G.playedThisTurn;
  // ★ ターン終了はprocessingに関係なく自分のターンなら押せる（詰み防止）
  document.getElementById('btnEnd').disabled=!mt;
}
window.showTT=function(e,i){const me=G?.players?.[mySlot];if(!me)return;const card=me.hand?.[i];if(!card)return;document.getElementById('ttN').textContent=card.name||'?';document.getElementById('ttS').textContent=`コスト:${Math.max(1,wCost(card)-(me._cB||0))} ATK:${wAtk(card)} DEF:${wDef(card)} [${getColors(card).map(c=>CN[c]||c).join('/')}]`;document.getElementById('ttSk').textContent=cskills(card).join('\n')||'スキルなし';document.getElementById('ttF').textContent=card.flavor||'';const t=document.getElementById('tooltip');t.style.display='block';const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;t.style.left=Math.min(cx+12,innerWidth-198)+'px';t.style.top=Math.max(cy-130,5)+'px';};
window.hideTT=function(){document.getElementById('tooltip').style.display='none';};

document.head.insertAdjacentHTML('beforeend',`<style>
@keyframes fup{0%{opacity:1;transform:translateY(0)scale(1.2)}80%{opacity:.8}100%{opacity:0;transform:translateY(-75px)scale(.7)}}
@keyframes sfA{0%{opacity:.45}100%{opacity:0}}
@keyframes swA{0%{transform:scale(.1);opacity:.9}100%{transform:scale(5);opacity:0}}
@keyframes ptA{0%{transform:translate(0,0)scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty))scale(0);opacity:0}}
@keyframes biIn{0%{opacity:0;transform:translateX(16px)scale(.85)}100%{opacity:1;transform:translateX(0)scale(1)}}
@keyframes biOut{0%{opacity:1}100%{opacity:0;transform:translateX(10px)}}
@keyframes dealCard{0%{opacity:0;transform:translateY(-40px)scale(.7)rotate(-8deg)}60%{opacity:1;transform:translateY(6px)scale(1.05)rotate(1deg)}100%{opacity:1;transform:translateY(0)scale(1)rotate(0)}}
.hand-card.dealing{animation:dealCard .38s cubic-bezier(.34,1.4,.64,1) forwards}
</style>`);

init();
</script>
</body>
